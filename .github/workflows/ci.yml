name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_32
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Show Zig version
        run: zig version

      - name: Check formatting
        run: >-
          zig fmt --check build.zig build docs/root.zig src tests
          components/os-abi-library components/os-root-task

      - name: Run unit tests
        run: zig build tests

      - name: Build kernel and root task
        run: zig build -Darch=${{ matrix.arch }}